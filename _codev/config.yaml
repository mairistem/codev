# codev configuration for... codev itself.
#
# This repository uses the tool it builds. That is deliberate: the only reliable
# way to know whether a format is pleasant to write is to write it.
schema: spec-driven

# Language of the prose skills write in artifacts (proposal, design,
# tasks, specs). Structural keywords such as `## Why` or
# `### Requirement:` always stay in English.
language: en

workflows:
  - propose
  - explore
  - apply
  - sync
  - archive
  - update
  - onboard

# The Jira MCP available in our Claude Code environment. Injected into the
# skills' frontmatter at install time (see `mcp__claude_ai_Atlassian_Rovo__*`
# in the tool listing of a recent session).
mcp:
  jira_tool: mcp__claude_ai_Atlassian_Rovo__getJiraIssue

context: |
  Rust project, Cargo workspace with four crates: codev-core (pure, no I/O),
  codev-engine (effects through ports), codev-agents (Claude Code target),
  codev-cli (imperative shell). The dependency graph between crates is acyclic
  and serves as the dependency rule.

  Functional core, imperative shell: the core returns plans of effects, the
  shell executes them. Nothing in codev-core touches the disk.

  The JSON output contract is a public API consumed by already installed
  skills: it lives in codev-cli::contract::v1 and never derives directly from
  the domain model.

  Typed errors with thiserror in the libraries, anyhow only in the CLI.
  Everything is written in English — code, identifiers, comments, messages —
  and comments explain the why.

  The documentation exists in English (docs/en) and French (docs/fr) with the
  same chapters; a change to one edition is made in both.

rules:
  specs:
    - A spec describes observable behavior, never an implementation. If the
      code can change without the spec changing, the spec is at the right level.
  design:
    - Cite the decision(s) in _codev/decisions/ that constrain the approach,
      rather than re-debating a choice already settled.
  tasks:
    # Quoted: a ": " inside a plain scalar would make YAML read this line as a
    # map.
    - "Each task states how to verify it is done: a named test, a command, or
       an observable behavior."
