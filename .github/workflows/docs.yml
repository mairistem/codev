name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the documentation site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          # Pinned: the Mairistem theme (docs/theme/index.hbs) is derived
          # from the templates of this exact mdBook version.
          tool: mdbook@0.5.4
      - name: Build both languages
        run: |
          set -eu
          mdbook build docs/en --dest-dir "$PWD/site/en"
          mdbook build docs/fr --dest-dir "$PWD/site/fr"
      - name: Add the landing page at the site root
        run: |
          set -eu
          cp -R docs/site/. site/
          # The landing page shares the theme's fonts and favicon.
          mkdir -p site/fonts
          cp docs/theme/fonts/*.woff2 docs/theme/fonts/IBM-PLEX-LICENSE.txt site/fonts/
          cp docs/theme/favicon.svg site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
