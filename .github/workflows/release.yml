name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # required to publish a GitHub Release

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            ext: tar.gz
          # Cross-compiled from Apple Silicon to Intel: rustc supports it
          # natively, and Intel macOS runners are becoming scarce.
          - runner: macos-14
            target: x86_64-apple-darwin
            ext: tar.gz
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            ext: tar.gz
          # Windows: a `.zip` archive (the platform convention; native
          # `Expand-Archive` since PowerShell 5.1) holding `codev.exe`.
          # MSVC toolchain, preinstalled on the runner.
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (Linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --bin codev --target ${{ matrix.target }}

      - name: Compute version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package tarball (Unix)
        if: matrix.ext == 'tar.gz'
        run: |
          set -eu
          version="${{ steps.version.outputs.version }}"
          target="${{ matrix.target }}"
          stage="codev-${version}-${target}"
          mkdir -p "${stage}"
          cp "target/${target}/release/codev" "${stage}/"
          cp README.md README.fr.md LICENSE CHANGELOG.md "${stage}/"
          tar czf "${stage}.tar.gz" "${stage}"

      - name: Package zip (Windows)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $target  = "${{ matrix.target }}"
          $stage   = "codev-$version-$target"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item "target/$target/release/codev.exe" $stage
          Copy-Item README.md, README.fr.md, LICENSE, CHANGELOG.md $stage
          Compress-Archive -Path $stage -DestinationPath "$stage.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: codev-${{ steps.version.outputs.version }}-${{ matrix.target }}
          path: codev-${{ steps.version.outputs.version }}-${{ matrix.target }}.${{ matrix.ext }}
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: [build]
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Compute SHA-256 sums
        working-directory: dist
        run: |
          set -eu
          shasum -a 256 *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
