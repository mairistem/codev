name: Feature request
description: Suggest an improvement or a new capability.
title: "feat: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        For open-ended ideas, consider starting a
        [discussion](https://github.com/mairistem/codev/discussions) first.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing today? Describe a concrete situation.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How you imagine it could work. No commitment to an implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you ruled out, and why.
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in this request, and what is explicitly not.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: References, related issues, prior art.
