name: Bug report
description: Report incorrect or unexpected behavior in codev.
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search
        [existing issues](https://github.com/mairistem/codev/issues) first.
        **Security vulnerabilities must not be reported here** — see
        [SECURITY.md](https://github.com/mairistem/codev/blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear, one-paragraph description of the problem.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The smallest sequence of commands that triggers the bug.
      placeholder: |
        1. codev init
        2. codev new change add-login
        3. codev validate --strict
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Paste the exact output, including error messages.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: codev version
      description: Output of `codev --version`.
      placeholder: codev 0.3.2
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.1 (arm64), Ubuntu 24.04, Windows 11…
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Relevant `_codev/config.yaml` excerpt, Claude Code version, logs.
