# The built-in step roles of codev.
#
# Embedded in the binary and served by `codev roles`. Each role owns one
# question at one workflow step, and lists the "done when" criteria the
# skill checks there. The skills keep the procedure (what to do, outputs,
# caps, guardrails); the criteria live here only.
#
# The artifact roles (product owner, QA analyst, architect, tech lead) are
# not here: they belong to the schema that defines the artifacts — see
# `assets/schemas/spec-driven/schema.yaml`.
#
# `required: true` marks a role a project cannot disable.

roles:
  - id: analyst
    name: { en: Analyst, fr: Analyste }
    at: plan.understand
    question: What must be built?
    done_when:
      - Do not proceed until you understand what must be built
      - If the request contains an ambiguity that would materially change
        the scope, the observable behavior, compatibility or the acceptance
        criteria, ask before creating the change
      - For a minor detail, make a reasonable assumption and record it in
        the artifacts

  - id: investigator
    name: { en: Investigator, fr: Enquêteur }
    at: plan.investigate
    question: What does the project already do?
    done_when:
      - Read `context` and `rules`, then inspect the relevant
        implementation, nearby tests, configuration and documentation
        outside `_codev/`. Stay read-only, and keep it proportionate to the
        change
      - Ground the scope, the approach and the tasks in what you find
      - Distinguish observed behavior, your assumptions, and what you
        propose to add
      - Report contradictions with existing specs instead of deciding alone
        which one is right
      - Do this discovery now. Do not leave generic tasks such as "explore
        the code" or "draw up a plan" for the implementation phase

  - id: tracer
    name: { en: Tracer, fr: Contrôleur de traçabilité }
    at: plan.trace
    question: Do the artifacts agree with each other?
    done_when:
      - Every capability in the proposal has its spec file, and every spec
        file is listed in the proposal
      - Every requirement has a nominal scenario and an error or edge-case
        scenario, or states why none applies
      - Every scenario is covered by a task whose verification refers to it
        and names an automated test, or says why automation is impossible
      - A task updates the documentation when the proposal's Impact touches
        documented behavior, or the plan states that none is affected
      - "The release note agrees with the plan: every **BREAKING** item of
        What Changes, and every REMOVED or user-breaking MODIFIED
        requirement, has a breaking item; an internal change says `None`"
      - "Every task's verification is concrete: a test, a command, an
        observable behavior"

  - id: skeptic
    name: { en: Skeptic, fr: Contradicteur }
    at: plan.challenge
    question: Would the plan survive a reviewer who did not write it?
    done_when:
      - "**Need** — does the change solve the Why? Is there a simpler
        solution, or one without code?"
      - "**Scope** — anything added that nobody asked for? An obvious case
        missing?"
      - "**Specs** — error and edge cases, not only the happy path? Is each
        requirement verifiable?"
      - "**Decisions** — does the design silently contradict a decision in
        effect?"
      - "**Assumptions** — which one, if wrong, would bring the plan down?"
      - "**Tasks** — can each one be verified?"
      - "Apply these lenses only when the proposal's Impact touches them:
        security & privacy, compatibility & migration, operability (logs,
        rollback), performance, accessibility & UX"
      - Also apply the `rules` you received through `codev instructions`

  - id: developer
    name: { en: Developer, fr: Développeur }
    at: code.implement
    question: Does each task work, verified?
    required: true
    done_when:
      - Read the files the task concerns. Stay read-only while you build
        understanding, then write
      - Each task in `tasks.md` states how to verify it is done — that
        verification is the acceptance criterion, not a suggestion
      - Write the code, the tests, the configuration, the documentation.
        Target what the task asks for, nothing more
      - Write tests like the project's existing test suite (framework,
        location, naming, unit or integration level), then by the
        conventions of its language and the project's `rules`
      - Take the test command from the `context` or `rules`, the manifest or
        the CI configuration — never guess one; if none is found, ask the
        user
      - "A failing build, a test turning red, a missing behavior: the task
        is not done. Fix, run again"

  - id: newcomer
    name: { en: Newcomer, fr: Nouvel arrivant }
    at: code.review
    question: Can a developer who has not seen the plan follow this code?
    done_when:
      - "**Without context**: each changed function makes sense without the
        plan or the conversation"
      - "**Names** say what things do; no obscure abbreviation"
      - "**Size and nesting**: a function too long or too nested is split,
        when it splits simply"
      - "**Cleverness**: dense one-liners, premature genericity, single-use
        abstractions — the simple version wins unless the clever one is
        justified"
      - "**Comments** explain the why where it is not obvious, never
        paraphrase the code"
      - "**Tests** read as a description of the behavior"
      - The project's `rules`, such as size thresholds
