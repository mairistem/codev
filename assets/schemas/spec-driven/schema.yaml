name: spec-driven
version: 1
description: Default codev workflow — proposal → specs → design → tasks

artifacts:
  - id: proposal
    generates: proposal.md
    description: What is being proposed, and why
    template: proposal.md
    requires: []
    instruction: |
      Role: product owner — owns WHY and WHAT.
      Done when:
      - Why states the problem and why now in one or two sentences;
      - What Changes are concrete bullets;
      - every breaking change is marked **BREAKING**;
      - every capability listed has a spec file (or `skip_specs: true`);
      - no implementation detail.

      Write the document that establishes WHY this change is needed.

      Sections:
      - **Why**: one or two sentences on the problem or opportunity.
        Why now?
      - **What Changes**: a bullet list, specific about the capabilities added,
        modified or removed. Mark breaking changes with **BREAKING**.
      - **Capabilities**: identify the specs that will be created or modified.
        - *New Capabilities*: each one produces a `specs/<path>/spec.md`.
          Use kebab-case for the segments you introduce, and follow the
          project's existing organization.
        - *Modified Capabilities*: only those whose REQUIREMENTS change,
          not those where only the implementation changes. Reuse the exact
          existing path under `_codev/specs/`.
      - **Impact**: affected code, APIs, dependencies and systems.

      The Capabilities section is the contract between this artifact and the
      specs: every capability listed must have its own spec file. Study the
      existing specs before filling it in.

      Every change must either declare at least one capability, or explicitly
      opt out of specs by setting `skip_specs: true` in its `change.yaml`.
      Never invent a requirement just to satisfy validation: specs describe
      behavior, so if the behavior does not change, no spec should change.

      Stay concise. The how belongs in design.md.

  - id: specs
    generates: "specs/**/*.md"
    description: Spec deltas — what the system must do
    template: spec.md
    requires: [proposal]
    instruction: |
      Role: QA analyst — owns observable behavior.
      Done when:
      - each requirement uses SHALL or MUST on observable behavior;
      - each requirement has at least one nominal scenario and one error or
        edge-case scenario, or says why none applies;
      - no internal names, libraries or implementation steps.

      Write the spec files that define WHAT the system must do.

      A spec is a behavioral contract, not an implementation plan.

      What belongs in a spec: observable behavior that users or downstream
      systems depend on, inputs, outputs, error conditions, external
      constraints (security, privacy, reliability, compatibility), and
      verifiable scenarios.

      What does not belong: internal class or function names, library
      choices, implementation steps, execution plans.

      Quick test: if the implementation can change without the observable
      behavior changing, it does not go in the spec.

      One file per capability listed under the proposal's Capabilities, at
      `specs/<path>/spec.md`, preserving the exact path. At least one file is
      required, unless `change.yaml` sets `skip_specs: true`.

      Delta operations, as level-2 headings:
      - `## ADDED Requirements` — new behavior
      - `## MODIFIED Requirements` — changed behavior; the block MUST be
        copied in full from the main spec, then edited
      - `## REMOVED Requirements` — with **Reason** and **Migration**
      - `## RENAMED Requirements` — in `FROM:` / `TO:` format

      The format is strict:
      - a requirement: `### Requirement: <name>` followed by its description
      - use SHALL or MUST for normative requirements
      - a scenario: `#### Scenario: <name>` with **WHEN** / **THEN** lines
      - scenarios MUST use exactly four hash marks; three hash marks or a
        bullet list fail silently
      - every requirement has at least one scenario

      New capability only: start the delta with `## Purpose`, one or two
      sentences on what the capability is for. Archiving copies it into the
      main spec it creates. Do not add a `## Purpose` to the delta of an
      existing capability: it already has one, and the delta's would be
      ignored.

      Common pitfall: a `MODIFIED` block with partial content loses detail at
      archive time. If you are adding a new concern without changing existing
      behavior, use `ADDED`.

  - id: design
    generates: design.md
    description: Technical approach and decisions
    template: design.md
    requires: [proposal]
    instruction: |
      Role: architect — owns HOW.
      Done when:
      - each decision names the alternative it rejects and why;
      - each risk has a mitigation;
      - the accepted decisions in `_codev/decisions/` that constrain the
        approach are cited and followed, or a supersession is explicitly
        proposed;
      - Open Questions only holds what can genuinely wait.

      Write the document that explains HOW to implement the change.

      Only create it if one of the following applies: a change spanning
      several modules or services, a new architectural pattern, a new
      external dependency, a significant data model change, a security,
      performance or migration concern, or an ambiguity that is better
      resolved before coding.

      Sections:
      - **Context**: only the current state and the constraints needed to
        understand the approach. Refer to the proposal for the motivation
        rather than repeating it.
      - **Goals / Non-Goals**: design-level boundaries.
      - **Decisions**: the technical choices with their rationale, and the
        alternatives considered for each.
      - **Risks / Trade-offs**: in [Risk] → Mitigation format.
      - **Migration Plan**, if applicable.
      - **Open Questions**: only the unknowns that can genuinely be
        deferred. If a question would change the specs, the approach or the
        task breakdown, resolve it now — ask the user rather than guess.

      Before settling anything, read the decisions in force in
      `_codev/decisions/`. An accepted decision is not re-debated: either you
      follow it, or you explicitly propose to supersede it.

  - id: tasks
    generates: tasks.md
    description: Checkbox-tracked task list
    template: tasks.md
    requires: [specs, design]
    instruction: |
      Role: tech lead — owns sequencing and verification.
      Done when:
      - each task fits one work session and is ordered by dependency;
      - each task names its verification (test, command, observable
        behavior);
      - every spec scenario is covered by at least one task's verification.

      Break down the implementation work.

      Before writing, reread the Open Questions in design.md. If one of them
      changes what needs to be built, settle it with the user first — do not
      bury an unstated assumption in the task list.

      The checkbox format is parsed to track progress: a task that does not
      use `- [ ]` will not be tracked.

      - group tasks under numbered level-2 headings
      - a task: `- [ ] X.Y Description`
      - a task must fit within a single work session
      - order by dependency
      - each task states how to verify that it is done: a named test, a
        command, an observable behavior or a delivered artifact. Reserve a
        separate verification task for behaviors that span several tasks.

      Rely on the specs for what to build, and on the design for how.

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Read the change's artifacts, work through the pending tasks, and check them
    off as you go. Stop if you hit a blocker or need clarification.
