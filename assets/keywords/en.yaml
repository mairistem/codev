delta.added: "## ADDED Requirements"
delta.modified: "## MODIFIED Requirements"
delta.removed: "## REMOVED Requirements"
delta.renamed: "## RENAMED Requirements"
removed.reason: "**Reason**"
removed.migration: "**Migration**"
renamed.from: "FROM:"
renamed.to: "TO:"
normative: [SHALL, MUST]
proposal.what_changes: "## What Changes"
proposal.domains: "## Domains"
proposal.release_note: "## Release note"
none: None
category.added: Added
category.changed: Changed
category.deprecated: Deprecated
category.removed: Removed
