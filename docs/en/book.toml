[book]
title = "Compagnon"
description = "Spec-driven development for Claude Code"
authors = ["The compagnon contributors"]
language = "en"
src = "src"

[output.html]
git-repository-url = "https://github.com/mairistem/compagnon"
edit-url-template = "https://github.com/mairistem/compagnon/edit/main/docs/en/{path}"
site-url = "/compagnon/en/"

# Mairistem theme, shared by both books: `theme/` is a symlink to
# ../theme. Light is Mairistem light; `navy` is restyled as Mairistem dark.
default-theme = "light"
preferred-dark-theme = "navy"
additional-css = ["theme/mairistem.css"]
additional-js = ["theme/mairistem.js"]
no-section-label = true
