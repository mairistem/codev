# compagnon configuration — generated by `compagnon init`.
# Hand-editable: each non-trivial field carries its source as a comment.

schema: spec-driven

# Language skills write the artifacts in (proposal, design, tasks,
# specs). Structural keywords such as `## Why` or `### Requirement:`
# follow it when compagnon ships the language, and stay in English otherwise.
# set with `compagnon init --language`
language: en

workflows:
  - propose
  - explore
  - onboard
  - apply
  - sync
  - archive
  - update
  - configure

# detected from the manifests
context: |
  Go 1.22 command-line tool, standard library only, tests with go test.

# written by /compagnon-configure
rules:
  specs:
    - "A requirement describes what the command prints or its exit code."
  design:
    - "Keep the checker free of global state: the HTTP client is passed in."
  tasks:
    - "Tests are `_test.go` files next to the code, using `httptest`; run `go test ./...`."
    - "Each task names the test that verifies it."
