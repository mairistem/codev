# compagnon configuration — generated by `compagnon init`.
# Hand-editable: each non-trivial field carries its source as a comment.

schema: spec-driven

# Language skills write the artifacts in (proposal, design, tasks,
# specs). Structural keywords such as `## Why` or `### Requirement:`
# follow it when compagnon ships the language, and stay in English otherwise.
# set with `compagnon init --language`
language: en

workflows:
  - propose
  - explore
  - onboard
  - apply
  - sync
  - archive
  - update
  - configure

# detected from the manifests
context: |
  Go 1.22 service, standard library HTTP, tests with go test.

# written by /compagnon-configure
rules:
  specs:
    - "A requirement states the gateway's behavior the shop relies on."
  design:
    - "Name the package of `internal/` a decision touches."
  tasks:
    - "Tests are `_test.go` files next to the code; run `go test ./...` and `go vet ./...`."
