<form class="newsletter" action="/newsletter" method="post" aria-labelledby="newsletter-title">
  <h2 id="newsletter-title">Get the monthly newsletter</h2>
  <label for="newsletter-email">E-mail address</label>
  <input
    id="newsletter-email"
    name="email"
    type="email"
    autocomplete="email"
    required
    aria-describedby="newsletter-hint"
  />
  <p id="newsletter-hint" class="hint">One e-mail a month. Unsubscribe from any issue.</p>
  <button type="submit">Subscribe</button>
</form>
